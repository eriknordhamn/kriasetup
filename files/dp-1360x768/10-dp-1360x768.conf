# Adds 1360x768@60 (CVT reduced blanking, 72 MHz) to the KR260 DisplayPort output.
# The PS DP port is single-lane (~90 MHz max), so the monitor's 1080p and other
# wide EDID modes are dropped; this mode fits. See docs/display.md in kriasetup.
# Matched by output name: X uses a Monitor section whose Identifier equals the output.
# Remove: sudo rm /etc/X11/xorg.conf.d/10-dp-1360x768.conf, then log out and back in.
Section "Monitor"
	Identifier	"DP-1"
	Modeline	"1360x768R"  72.00  1360 1408 1440 1520  768 771 781 790 +hsync -vsync
	Option		"PreferredMode"	"1360x768R"
EndSection
